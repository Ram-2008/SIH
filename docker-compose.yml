version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bhu_drishti_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bhu_drishti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhu_drishti_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/bhu_drishti
      - SECRET_KEY=bhu-drishti-secret-key-hackathon-2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sample-data:/app/sample-data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhu_drishti_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
